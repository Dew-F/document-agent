[project]
name = "document-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "False Dew", email = "falsedew@duck.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
document-agent = "document_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
