services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: document-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_agent
      POSTGRES_USER: document_agent
      POSTGRES_PASSWORD: document_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: document-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
